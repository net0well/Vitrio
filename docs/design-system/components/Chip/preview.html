<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Chip — Vitrio</title></head>
<body>
<div id="root"></div>
<script>
  var V = window.Vitrio, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    h('div', { className: 'vt-demo-row' },
      h(V.Chip, { defaultSelected: true }, 'Perto de mim'),
      h(V.Chip, null, 'Nota 4,5+'),
      h(V.Chip, null, 'MEI verificado'),
      h(V.Chip, null, 'Atende hoje')),
    h('div', { className: 'vt-demo-row' },
      h(V.Chip, { variant: 'soft', defaultSelected: true }, 'Pontual'),
      h(V.Chip, { variant: 'soft' }, 'Caprichoso'),
      h(V.Chip, { variant: 'soft', defaultSelected: true }, 'Preço justo'),
      h(V.Chip, { variant: 'soft' }, 'Deixou tudo limpo'))));
</script>
</body>
</html>
