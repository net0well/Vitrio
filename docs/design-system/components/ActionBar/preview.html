<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>ActionBar — Vitrio</title></head>
<body>
<div id="root"></div>
<script>
  var V = window.Vitrio, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    h(V.ActionBar, { note: 'Pedir orçamento é grátis e sem compromisso.' }, h(V.Button, { size: 'lg', block: true, trailingIcon: 'send' }, 'Enviar pedido')),
    h(V.ActionBar, { note: 'O cliente verá esse registro no pedido.' }, h(V.Button, { variant: 'secondary' }, 'Voltar'), h(V.Button, { trailingIcon: 'check' }, 'Confirmar recebimento'))));
</script>
</body>
</html>
