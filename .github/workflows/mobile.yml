name: Mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Conferir código gerado
        run: |
          dart run build_runner build
          flutter gen-l10n
          git diff --exit-code -- lib

      - name: Analisar
        run: flutter analyze

      - name: Testar
        run: flutter test

      - name: Compilar APK de dev
        run: flutter build apk --flavor dev -t lib/main_dev.dart --debug
