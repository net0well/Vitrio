name: vitrio

services:
  postgres:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: vitrio
      POSTGRES_USER: vitrio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrio -d vitrio"]
      interval: 5s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:2026.1
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - seq-data:/data

volumes:
  postgres-data:
  seq-data:
