<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} no Vitrio</title>
  <meta name="description" content="{{description}}">
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Vitrio">
  <meta property="og:title" content="{{titleAttribute}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:locale" content="pt_BR">
  <link rel="canonical" href="{{url}}">
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #F5F3F8; color: #1B1622; }
    main { max-width: 420px; margin: 0 auto; padding: 32px 20px; text-align: center; }
    .brand { color: #3D1F56; font-weight: 800; letter-spacing: -0.02em; font-size: 20px; }
    .photo { width: 112px; height: 112px; border-radius: 24px; object-fit: cover; margin: 24px auto 0; display: block; }
    h1 { font-size: 24px; margin: 20px 0 4px; letter-spacing: -0.02em; }
    p { margin: 4px 0; color: #4A4458; }
    .rating { margin-top: 12px; font-weight: 700; color: #3D1F56; }
    .play { display: block; margin-top: 28px; padding: 16px; border-radius: 16px; background: #3D1F56; color: #FFFFFF; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
<main>
  <div class="brand">Vitrio</div>
  {{image}}
  <h1>{{name}}</h1>
  <p>{{headline}}</p>
  <p>{{place}}</p>
  <p class="rating">{{rating}}</p>
  <a class="play" href="{{playStore}}">Baixar o Vitrio na Google Play</a>
</main>
</body>
</html>
