<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Perfil não disponível no Vitrio</title>
  <link rel="icon" type="image/svg+xml" href="{{icon}}">
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #F6F4F8; color: #17121F; }
    main { max-width: 420px; margin: 0 auto; padding: 32px 20px; text-align: center; }
    .brand svg { display: block; width: 115px; height: 40px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 20px 0 4px; letter-spacing: -0.02em; }
    p { margin: 4px 0; color: #4F4960; }
    .play { display: block; margin-top: 28px; padding: 16px; border-radius: 16px; background: #3E1F57; color: #FFFFFF; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
<main>
  <div class="brand">{{wordmark}}</div>
  <h1>Perfil não disponível</h1>
  <p>Este profissional não está com a vitrine no ar agora. Encontre outros perto de você no app.</p>
  <a class="play" href="{{playStore}}">Baixar o Vitrio na Google Play</a>
</main>
</body>
</html>
